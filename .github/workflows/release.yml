name: Print release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: bash scripts/print.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/wiki-template.pdf --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
