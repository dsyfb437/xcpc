site_name: xcpc
site_description: 一个可同时生成网页和 A4 文档的 Markdown 模板
site_author: dsyfb437
site_url: https://azusaaa.com/xcpc/
copyright: Copyright &copy; 2026 dsyfb437

theme:
  name: material
  language: zh
  icon:
    logo: material/school
  font:
    text: Fira Sans
    code: Fira Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link

nav:
  - 首页: index.md
  - 基础算法: basics.md
  - 树上算法: trees.md
  - 图论: graphs.md

plugins:
  - search:
      lang: zh

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: ""
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-mml-svg.js
